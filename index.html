<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jahaziel's UAGC GEN 102 Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h1>UAGC GEN 102 Calculator</h1>

        <input type="number" id="number1" placeholder="First number">
        <input type="number" id="number2" placeholder="Second number">

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">−</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>
        </div>

        <h2>Result: <span id="result">0</span></h2>
    </div>

    <script src="script.js"></script>

</body>
</html>
